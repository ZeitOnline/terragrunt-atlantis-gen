    - '*.tf*'
    - '*.tofu*'
    - ../root.hcl
    - ../modules/root/*.tf*
    - ../modules/root/*.tofu*
    - ../modules/another/*.tf*
    - ../modules/another/*.tofu*
    - ../modules/shared/*.tf*
