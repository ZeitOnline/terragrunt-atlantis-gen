automerge: false
parallel_apply: true
parallel_plan: true
projects:
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
    - '*.tofu*'
  dir: apply_only
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
    - '*.tofu*'
    - ../root.hcl
  dir: overridden
version: 3
